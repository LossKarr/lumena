name: Certified Release - Lumena

on:
  push:
    branches: [main, master]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: certified-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: version
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import re
          from pathlib import Path

          path = Path("src/version.py")
          text = path.read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "(\d+)\.(\d+)\.(\d+)"$', text, re.MULTILINE)
          if not match:
              raise SystemExit("Canonical version missing from src/version.py")
          major, minor, patch = map(int, match.groups())
          current = ".".join(match.groups())
          tag_exists = subprocess.run(
              ["git", "rev-parse", "--quiet", "--verify", f"refs/tags/v{current}"],
              check=False,
              stdout=subprocess.DEVNULL,
          ).returncode == 0
          new = f"{major}.{minor}.{patch + 1}" if tag_exists else current
          if new != current:
              path.write_text(
                  text.replace(f'__version__ = "{current}"', f'__version__ = "{new}"', 1),
                  encoding="utf-8",
              )
          Path(".release-version").write_text(new, encoding="ascii")
          PY
          VERSION=$(cat .release-version)
          rm .release-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/version.py; then
            git add src/version.py
            git commit -m "release: v$VERSION [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          COMMIT=$(git rev-parse HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Create visible release immediately
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v${{ needs.prepare.outputs.version }}"
          EXPECTED="${{ needs.prepare.outputs.commit }}"
          if git rev-parse --quiet --verify "refs/tags/$TAG" >/dev/null; then
            ACTUAL=$(git rev-list -n 1 "$TAG")
            test "$ACTUAL" = "$EXPECTED"
          else
            git tag -a "$TAG" "$EXPECTED" -m "Lumena $TAG"
            git push origin "$TAG"
          fi
      - name: Publish GitHub Release shell
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Lumena v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false

  lint:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint certified updater surface
        run: >-
          ruff check
          src/version.py
          src/runtime/update_manifest.py
          src/runtime/update_service.py
          src/runtime/update_installation.py
          src/runtime/update_guard_smoke.py
          web/routes/updates.py
          scripts/build_release_artifacts.py
          scripts/lumena_updater.py
          tests/release
          tests/runtime/test_update_manifest.py
          tests/runtime/test_update_service.py
          tests/runtime/test_update_installation.py
          tests/runtime/test_lumena_updater_helper.py
          tests/web/test_health_identity.py
          tests/web/test_updates_routes.py
          tests/web/test_updates_ui.py
          --select F821,F811,E722 --ignore E501,E402

  test:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pytest pytest-asyncio pytest-timeout pytest-mock
      - run: python -m pytest tests/ --timeout=60 --tb=short -q

  package:
    needs: [prepare, lint, test]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build lightweight certified package
        shell: pwsh
        run: |
          python scripts/build_release_artifacts.py `
            --output release-assets `
            --commit "${{ needs.prepare.outputs.commit }}" `
            --ci-run-id "${{ github.run_id }}" `
            --ci-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" `
            --release-notes-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: certified-release-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [prepare, release, lint, test, package]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: certified-release-assets
          path: release-assets
      - name: Verify exact release SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.commit }}"
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("release-assets/update-manifest.json").read_text())
          expected = "${{ needs.prepare.outputs.commit }}"
          assert m["commit"] == expected
          assert m["ci"]["conclusion"] == "success"
          assert m["ci"]["commit"] == expected
          PY
      - name: Attest update package provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: release-assets/lumena-update-windows-x64.zip
      - name: Attach certified assets to existing release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Lumena v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/lumena-update-windows-x64.zip
            release-assets/lumena-update-windows-x64.zip.sha256
            release-assets/update-manifest.json
            release-assets/release-certification.json
