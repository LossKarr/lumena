name: lumena-phase-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.py"
      - "tests/**"
      - "scripts/ci_phase_gate.py"
      - ".github/workflows/phase-gate.yml"
      - "requirements*.txt"
  push:
    branches:
      - main
      - master

jobs:
  # ── Job 0: lint rapide ────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff>=0.5.0

      - name: Ruff check (dangerous errors — blocks CI)
        run: ruff check src/ web/ tests/ --select F821,F811,E722 --ignore E501,E402

      - name: Ruff check (all E,F,W — advisory only)
        run: ruff check src/ web/ tests/ --select E,F,W --ignore E501,E402 --exit-zero

      - name: Ruff format check (advisory only)
        run: ruff format --check src/ web/ tests/ --diff || true

  # ── Job 1: subset critique (rapide, Ubuntu) ──────────────────────
  gate-critical:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y portaudio19-dev libsndfile1-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pytest pytest-asyncio pytest-timeout pytest-mock

      - name: Run critical gate
        run: python scripts/ci_phase_gate.py --timeout=15

  # ── Job 2: suite complète × 3 (Windows) ──────────────────────────
  full-windows:
    runs-on: windows-latest
    needs: gate-critical
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pytest pytest-asyncio pytest-timeout pytest-mock

      - name: Run full suite x3
        run: python scripts/ci_phase_gate.py --full --runs=3 --timeout=15
