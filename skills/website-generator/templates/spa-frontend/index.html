<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PROJECT_TITLE}}</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ═══ HEADER GLOBAL ═══ -->
  <header id="main-header">
    <div class="container header-inner">
      <a href="#" class="logo" onclick="navigateTo('page-accueil'); return false;">{{PROJECT_TITLE}}</a>
      <nav class="main-nav" id="mainNav">
        <a href="#" data-page="page-accueil" class="active" onclick="navigateTo('page-accueil'); return false;">Accueil</a>
        <!-- Ajouter d'autres liens ici -->
        <a href="#" data-page="page-contact" onclick="navigateTo('page-contact'); return false;">Contact</a>
      </nav>
      <button class="hamburger" onclick="toggleMobileMenu()" aria-label="Menu mobile">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </header>

  <!-- Overlay mobile -->
  <div class="mobile-overlay" id="mobileOverlay" onclick="toggleMobileMenu()"></div>

  <!-- ═══ PAGE ACCUEIL ═══ -->
  <section id="page-accueil" class="active">
    <div class="hero">
      <div class="container hero-content">
        <h1 class="fade-in">{{PROJECT_TITLE}}</h1>
        <p class="hero-subtitle fade-in" data-delay="100">Votre description ici</p>
        <div class="hero-cta fade-in" data-delay="200">
          <a href="#" class="btn-primary" onclick="navigateTo('page-contact'); return false;">
            Commencer <i class="fas fa-arrow-right"></i>
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══ PAGE CONTACT ═══ -->
  <section id="page-contact" style="display:none;">
    <div class="container section-padding">
      <h2 class="section-title fade-in">Contact</h2>
      <form class="contact-form fade-in" data-delay="100" onsubmit="handleContactForm(event)">
        <div class="form-group">
          <label for="name">Nom</label>
          <input type="text" id="name" required placeholder="Votre nom">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="votre@email.com">
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" required placeholder="Votre message..."></textarea>
        </div>
        <button type="submit" class="btn-primary">
          Envoyer <i class="fas fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </section>

  <!-- ═══ FOOTER GLOBAL ═══ -->
  <footer>
    <div class="container footer-inner">
      <p>&copy; {{YEAR}} {{PROJECT_TITLE}}. Tous droits réservés.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/app.js"></script>
</body>
</html>
