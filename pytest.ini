[pytest]
testpaths = tests
norecursedirs = venv Backup workspace unity __pycache__ _archived_markets web
asyncio_mode = strict
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    e2e: marks end-to-end browser tests (requires running server)
    no_emotion_isolation: skip emotion state isolation fixture
    timeout: marks tests with a maximum execution time (requires pytest-timeout)
filterwarnings =
    ignore:pkg_resources is deprecated as an API.*:UserWarning
    ignore:Deprecated call to `pkg_resources\.declare_namespace\('google'\)`.*:DeprecationWarning
    ignore::DeprecationWarning:speech_recognition
    ignore:.*pkgutil.find_loader.*:DeprecationWarning:pytesseract
    ignore:.*Image\.Image\.getdata is deprecated.*:DeprecationWarning
    ignore::ResourceWarning:asyncio
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore:coroutine.*was never awaited:RuntimeWarning
    ignore:.*unclosed event loop.*:DeprecationWarning
    ignore:pytest-asyncio detected an unclosed event loop when tearing down the event_loop.*:DeprecationWarning
    ignore::DeprecationWarning:pytest_asyncio
    ignore::pluggy.PluggyTeardownRaisedWarning
    ignore::DeprecationWarning:websockets
    ignore::DeprecationWarning:datetime
    ignore::UserWarning:pygame
    ignore:invalid escape sequence:SyntaxWarning:pywinauto
