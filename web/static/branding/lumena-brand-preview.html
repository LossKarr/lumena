<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumena Brand Preview</title>
  <style>
    :root {
      --bg: #07101c;
      --panel: #0d1728;
      --line: rgba(255,255,255,0.1);
      --text: #eef2ff;
      --muted: #98a2b3;
      --accent: #ff7a6d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(255,122,109,0.14), transparent 32%),
        radial-gradient(circle at bottom right, rgba(139,241,230,0.08), transparent 26%),
        var(--bg);
      color: var(--text);
      padding: 32px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 40px;
      letter-spacing: -1px;
    }
    p {
      margin: 0 0 28px;
      color: var(--muted);
      max-width: 760px;
      line-height: 1.5;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
    }
    .label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    img {
      width: 100%;
      display: block;
      border-radius: 16px;
      background: #050811;
    }
  </style>
</head>
<body>
  <h1>Lumena Brand Concepts</h1>
  <p>
    Direction retenue: premium dark tech, soft anime influence, luminous mascot, clean silhouettes,
    original design language. These are vector drafts intended to validate mood and shape language.
  </p>
  <div class="grid">
    <section class="card">
      <div class="label">Mark</div>
      <img src="/static/branding/lumena-logo-mark.svg" alt="Lumena mascot mark">
    </section>
    <section class="card">
      <div class="label">Horizontal Lockup</div>
      <img src="/static/branding/lumena-logo-horizontal.svg" alt="Lumena horizontal logo">
    </section>
    <section class="card">
      <div class="label">Boot Splash</div>
      <img src="/static/branding/lumena-boot-splash.svg" alt="Lumena boot splash">
    </section>
  </div>
</body>
</html>
